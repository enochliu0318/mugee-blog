{{/* Gallery shortcode with embedded lightbox viewer */}}
{{ $galleryId := printf "gallery-%d" .Ordinal }}
<div class="gallery-masonry" id="{{ $galleryId }}" data-gallery>
  {{ $images := .Page.Resources.ByType "image" }}
  {{ range $index, $img := $images }}
    <div class="gallery-masonry-item">
      <a href="{{ $img.RelPermalink }}"
         class="gallery-item-link"
         data-gallery-src="{{ $img.RelPermalink }}"
         data-gallery-index="{{ $index }}"
         data-gallery-alt="{{ $img.Name }}"
         aria-label="查看图片：{{ $img.Name }}">
        <img src="{{ $img.RelPermalink }}" alt="{{ $img.Name }}" loading="lazy" />
      </a>
    </div>
  {{ end }}
</div>

{{/* Lightbox markup is injected once by JS to avoid duplication */}}

<style>
/* 瀑布流布局 */
.gallery-masonry {
  column-count: 3;
  column-gap: 16px;
  width: 100%;
}

.gallery-masonry-item {
  break-inside: avoid;
  margin-bottom: 16px;
}

.gallery-masonry-item img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
  transition: transform 0.2s ease, opacity 0.2s ease;
  cursor: zoom-in;
}

.gallery-masonry-item img:hover {
  transform: scale(1.02);
  opacity: 0.92;
}

@media (max-width: 768px) {
  .gallery-masonry {
    column-count: 2;
  }
}

@media (max-width: 480px) {
  .gallery-masonry {
    column-count: 1;
  }
}

/* ========== Lightbox ========== */
.mugee-lightbox {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.92);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  -webkit-user-select: none;
  user-select: none;
}

.mugee-lightbox.is-open {
  opacity: 1;
  visibility: visible;
}

.mugee-lightbox__stage {
  position: relative;
  max-width: 92vw;
  max-height: 88vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mugee-lightbox__img {
  max-width: 92vw;
  max-height: 88vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.mugee-lightbox__img.is-loading {
  opacity: 0.3;
}

/* 关闭按钮 */
.mugee-lightbox__close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
  z-index: 10;
}

.mugee-lightbox__close:hover,
.mugee-lightbox__close:focus {
  background: rgba(255, 255, 255, 0.25);
  outline: none;
}

/* 左右箭头 */
.mugee-lightbox__nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, opacity 0.2s ease;
  z-index: 10;
}

.mugee-lightbox__nav:hover,
.mugee-lightbox__nav:focus {
  background: rgba(255, 255, 255, 0.25);
  outline: none;
}

.mugee-lightbox__nav:disabled {
  opacity: 0.25;
  cursor: default;
}

.mugee-lightbox__prev {
  left: 16px;
}

.mugee-lightbox__next {
  right: 16px;
}

/* 计数器 */
.mugee-lightbox__counter {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.85);
  font-size: 14px;
  letter-spacing: 0.05em;
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 12px;
  border-radius: 12px;
  z-index: 10;
}

/* 移动端适配 */
@media (max-width: 640px) {
  .mugee-lightbox__nav {
    width: 40px;
    height: 40px;
    font-size: 22px;
  }

  .mugee-lightbox__prev {
    left: 8px;
  }

  .mugee-lightbox__next {
    right: 8px;
  }

  .mugee-lightbox__close {
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    font-size: 24px;
  }

  .mugee-lightbox__stage {
    max-width: 96vw;
    max-height: 82vh;
  }

  .mugee-lightbox__img {
    max-width: 96vw;
    max-height: 82vh;
  }
}

/* 防止滚动穿透 */
body.mugee-lightbox-open {
  overflow: hidden;
}
</style>
